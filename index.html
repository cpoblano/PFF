<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>PFF</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      canvas {
        background: #000000;
        display: block;
        margin: 0 auto;
      }
      button {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="myCanvas" width="1300" height="600"></canvas>
    
    <script>
      // ========== PART 1: GET CANVAS AND CONTEXT ==========
      const canvas = document.getElementById('myCanvas');
      const ctx = canvas.getContext('2d');

      // ========== PART 2: CREATE PLAYER OBJECT ==========
      let player = {
        x: 650,
        y: 0,
        width: 50,
        height: 50,
        speed: 5,
        velocityY: 0,      // ADDED THIS
        isJumping: false   // ADDED THIS
      };

      // ========== PLATFORMS - FIXED: lowercase 'platforms' ==========
      let platforms = [
        {x: 0, y: 550, width: 1300, height: 50},
        {x: 0, y: 450, width: 300, height: 20},
        {x: 0, y: 350, width: 300, height: 20},
      ];

      // ========== PART 3: CREATE KEYS OBJECT ==========
      let keys = {
        w: false,
        a: false,
        s: false,
        d: false,
        space: false
      };

      // ========== PART 4: KEYBOARD EVENT LISTENERS ==========
      window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'w') keys.w = true;
        if (e.key.toLowerCase() === 'a') keys.a = true;
        if (e.key.toLowerCase() === 's') keys.s = true;
        if (e.key.toLowerCase() === 'd') keys.d = true;
        if (e.code === 'Space') keys.space = true;  // FIXED: 'Space' not 'space'
      });

      window.addEventListener('keyup', (e) => {
        if (e.key.toLowerCase() === 'w') keys.w = false;
        if (e.key.toLowerCase() === 'a') keys.a = false;
        if (e.key.toLowerCase() === 's') keys.s = false;
        if (e.key.toLowerCase() === 'd') keys.d = false;
        if (e.code === 'Space') keys.space = false;  // FIXED: 'Space' not 'space'
      });

      // ========== CHECK COLLISIONS ==========
      function checkCollisions() {
        for (let platform of platforms) {
          if (
            player.y + player.height >= platform.y &&
            player.y + player.height <= platform.y + 10 &&
            player.x + player.width > platform.x &&
            player.x < platform.x + platform.width
          ) {
            player.y = platform.y - player.height;
            player.velocityY = 0;
            player.isJumping = false;
          }
        }
      }

      // ========== DRAW PLATFORMS ==========
      function drawPlatforms() {
        ctx.fillStyle = "#00FF00";
        for (let platform of platforms) {
          ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
        }
      }

      // ========== PART 5: UPDATE FUNCTION ==========
      function updatePlayer() {
        // Horizontal movement
        if (keys.w) player.y -= player.speed;
        if (keys.s) player.y += player.speed;
        if (keys.a) player.x -= player.speed;
        if (keys.d) player.x += player.speed;

        // Jumping - FIXED: moved OUTSIDE the jump condition
        if (keys.space && !player.isJumping) {
          player.velocityY = -12;
          player.isJumping = true;  // FIXED: was 'play.isJumping'
        }

        // Gravity - FIXED: moved OUTSIDE the jump condition
        player.velocityY += 0.5;
        player.y += player.velocityY;

        // Check collisions - FIXED: moved OUTSIDE the jump condition
        checkCollisions();
      }

      // ========== PART 6: DRAW FUNCTION ==========
      function drawPlayer() {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(player.x, player.y, player.width, player.height);
      }

      // ========== PART 7: GAME LOOP ==========
      function gameLoop() {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // FIXED: Added drawPlatforms() call
        drawPlatforms();
        updatePlayer();
        drawPlayer();
        
        requestAnimationFrame(gameLoop);
      }

      // ========== PART 8: START THE GAME ==========
      gameLoop();
     
    </script>
  </body>
</html>
