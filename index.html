<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>PFF</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      canvas {
        background: #000000;
        display: block;
        margin: 0 auto;
      }
      button {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="myCanvas" width="1300" height="600"></canvas>
    <button id="runButton">Start Game</button>

    <script>
      // JavaScript code goes here
      const canvas=document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d");
      let x = canvas.width / 2;
      let y = canvas.height - 30;
      const dx = 2;
      const dy = -2;

     function drawball(){
      //drawing ball code
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.fillStyle = "#0095DD";
      ctx.fill();
      ctx.closePath();
     }

     function draw() {
      //drawinf code
     ctx.clearRect(0, 0, canvas.wodth, canvas.height);
     drawball();
      x += dx;
      y += dy;
     }
     setInterval(draw, 10);
     </script>
  </body>
</html>
